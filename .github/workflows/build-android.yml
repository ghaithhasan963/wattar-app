name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests get type checks only. No APK is built, so review does not
  # consume Android build minutes.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            wattar-app/package-lock.json
            wattar-admin/package-lock.json

      - name: Install app dependencies
        working-directory: wattar-app
        run: npm ci --no-audit --no-fund

      - name: Type-check app
        working-directory: wattar-app
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: wattar-app
        run: npm test

      - name: Install admin dependencies
        working-directory: wattar-admin
        run: npm ci --no-audit --no-fund

      - name: Type-check admin
        working-directory: wattar-admin
        run: npx tsc --noEmit

      - name: Run admin unit tests
        working-directory: wattar-admin
        run: npm test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wattar-app
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            wattar-app/package-lock.json
            wattar-admin/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate secrets and create Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const config = JSON.parse(process.env.GOOGLE_SERVICES_JSON || 'null');
          const hasMatchingAndroidApp = config?.client?.some(
            (client) => client.client_info?.android_client_info?.package_name === 'app.wattar.mobile',
          );
          if (!hasMatchingAndroidApp) {
            throw new Error('GOOGLE_SERVICES_JSON is missing or does not contain app.wattar.mobile.');
          }
          for (const name of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY']) {
            if (!process.env[name]) throw new Error(`Missing GitHub Actions secret: ${name}`);
          }
          let supabaseUrl;
          try {
            supabaseUrl = new URL(process.env.EXPO_PUBLIC_SUPABASE_URL);
          } catch {
            throw new Error('EXPO_PUBLIC_SUPABASE_URL must be a valid HTTPS Supabase project URL.');
          }
          if (
            supabaseUrl.protocol !== 'https:' ||
            /your_project|placeholder/i.test(supabaseUrl.hostname)
          ) {
            throw new Error('EXPO_PUBLIC_SUPABASE_URL must point to the real HTTPS Supabase project, not a placeholder.');
          }
          if (/^(placeholder|your_)/i.test(process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY.trim())) {
            throw new Error('EXPO_PUBLIC_SUPABASE_ANON_KEY contains a placeholder value.');
          }
          NODE
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Type-check app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Install admin dependencies
        working-directory: wattar-admin
        run: npm ci --no-audit --no-fund

      - name: Type-check admin
        working-directory: wattar-admin
        run: npx tsc --noEmit

      - name: Run admin unit tests
        working-directory: wattar-admin
        run: npm test

      - name: Generate Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: bash ./gradlew --no-daemon assembleRelease
        working-directory: wattar-app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wattar-android-apk-${{ github.run_number }}
          path: wattar-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
